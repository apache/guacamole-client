<div class="user-menu" [hidden]="isAnonymous()">
    <guac-menu [menuTitle]="username!">

        <!-- User profile view -->
        <div class="profile" [hidden]="!fullName">
            <div class="full-name"><a [attr.href]="userURL">{{ fullName }}</a></div>
            <div class="organizational-role" [hidden]="!role">{{ role }}</div>
            <div class="organization" [hidden]="!organization">{{ organization }}</div>
        </div>

        <!-- Local actions -->
        <ul class="action-list">
            @for (action of localActions; track action) {
                <li>
                    <a [ngClass]="action.className" (click)="action.callback()">
                        {{ action.name | transloco }}
                    </a>
                </li>
            }
        </ul>

        <!-- Navigation links -->
        <guac-page-list [pages]="pages"></guac-page-list>

        <!-- Actions -->
        <ul class="action-list">
            @for (action of actions; track action) {
                <li>
                    <a [ngClass]="action.className" (click)="action.callback()">
                        {{ action.name | transloco }}
                    </a>
                </li>
            }
        </ul>

    </guac-menu>
</div>
