<div class="login-ui" [ngClass]="{'error': loginError, 'continuation': isContinuation(), 'initial': !isContinuation()}">

    <!-- Login error message, as a text node so that line breaks within
         variables render as spaces, like in the AngularJS dialog -->
    <p class="login-error">{{ $safeNavigationMigration(loginError?.key) | transloco: (loginError?.variables || {}) }}</p>

    <div class="login-dialog-middle">

        <div class="login-dialog notification">

            <form class="login-form" (ngSubmit)="login()">

                <!-- Guacamole version -->
                <div class="logo"></div>
                <div class="version">
                    <div class="app-name">{{ 'APP.NAME' | transloco }}</div>
                    <div class="version-number">{{ 'APP.VERSION' | transloco }}</div>
                </div>

                <!-- Login message/instructions, as a text node like the error message -->
                <p [hidden]="!helpText">{{ $safeNavigationMigration(helpText?.key) | transloco: (helpText?.variables || {}) }}</p>

                <!-- Login fields -->
                <div class="login-fields">
                    <guac-form
                        namespace="LOGIN"
                        [content]="remainingFields"
                        [modelFormGroup]="enteredValues"
                        [focusedField]="$safeNavigationMigration(relevantField?.name)"
                        [disabled]="submitted"></guac-form>
                </div>

                <!-- Login/continue button -->
                <div class="buttons">

                    <input type="submit" name="login" class="login"
                           [disabled]="submitted"
                           [value]="'LOGIN.ACTION_LOGIN' | transloco">

                    <input type="submit" name="login" class="continue-login"
                           [disabled]="submitted"
                           [value]="'LOGIN.ACTION_CONTINUE' | transloco">

                </div>

            </form>

        </div>

    </div>

</div>
