<div class="page-list" [hidden]="!levels.length">

    <!-- Navigation links -->
    @for (level of levels; track trackByIndex($index)) {
        <ul class="page-list-level">
            @for (page of getPages(level); track page) {
                <li class="{{page.className}}">
                    <a class="home" (click)="navigateToPage(page)"
                       [ngClass]="{'current': isCurrentPage(page)}" [routerLink]="page.url">

                        <!-- If page.name is an array of translatable keys, translate all of them-->
                        @if (isArray(page.name)) {
                            @for (name of page.name; track name) {
                                {{ name | transloco }}
                            }
                        } @else {
                            {{ $any(page.name) | transloco }}
                        }
                    </a>
                </li>
            }
        </ul>
    }

</div>
